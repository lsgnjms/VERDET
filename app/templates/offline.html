<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0E11">
  <title>Offline · VERDET</title>
  <!-- Self-contained: no CDN, because this page is shown when there's no connection. -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0E11; color: #EAECEF;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #848E9C; max-width: 320px; margin: 0 auto 20px; line-height: 1.5; }
    button { background: #F7A600; color: #0B0E11; border: 0; border-radius: 10px; padding: 12px 20px; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <div>
    <img src="/static/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>VERDET shows live data from Hedera, so it needs a connection. Your meter keeps signing readings in the meantime.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>

{% extends "base.html" %}
{% block title %}Log in · VERDET{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-xl font-semibold mb-5">Log in</h1>

  {% if error %}
  <p class="mb-4 rounded-md bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="space-y-4">
    <label class="block">
      <span class="text-sm font-medium">Email</span>
      <input name="email" type="email" required value="{{ email or '' }}" autocomplete="email"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Password</span>
      <input name="password" type="password" required autocomplete="current-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </label>
    <button class="w-full rounded-md bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2">Log in</button>
  </form>
  <p class="mt-4 text-sm text-center text-slate-500">New here? <a href="/signup" class="text-emerald-700 underline">Create an account</a></p>
</div>
{% endblock %}

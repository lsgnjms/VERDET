{% extends "_auth_layout.html" %}
{% block title %}Log in · VERDET{% endblock %}
{% block form %}
<h1 class="text-2xl font-bold tracking-tight">Welcome back</h1>
<p class="mt-1.5 text-sm text-muted">Log in to see your meter, readings and VKWH.</p>

{% if error %}
<div class="mt-5 rounded-lg border border-down/30 bg-down/10 px-3 py-2.5 text-sm text-down">{{ error }}</div>
{% endif %}

<form method="post" action="/login" class="mt-6 space-y-4">
  <label class="block">
    <span class="label">Email</span>
    <input name="email" type="email" required value="{{ email or '' }}" autocomplete="email" placeholder="you@example.com" class="input mt-1.5">
  </label>
  <label class="block">
    <span class="label">Password</span>
    <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="input mt-1.5">
  </label>
  <button class="btn-primary w-full py-3">Log in</button>
</form>
<p class="mt-6 text-center text-sm text-muted">New here? <a href="/signup" class="font-medium text-sun-400 hover:underline">Create an account</a></p>
{% endblock %}

{% extends "base.html" %}
{% block title %}Wallet · VERDET{% endblock %}
{% block content %}
<section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-sm font-medium text-slate-500 uppercase tracking-wide">Your App ID</h1>
  <div class="mt-1 flex flex-wrap items-center gap-3">
    <span id="app-id" class="font-mono text-2xl font-semibold">{{ user.account_id }}</span>
    <button type="button"
            onclick="navigator.clipboard.writeText('{{ user.account_id }}'); this.textContent = 'Copied';"
            class="text-sm rounded-md border border-slate-300 px-2 py-1 hover:bg-slate-50">Copy</button>
    <a href="{{ hashscan_account(user.account_id) }}" target="_blank" rel="noopener"
       class="text-sm text-emerald-700 underline">View on HashScan ↗</a>
  </div>
  <p class="mt-1 text-xs text-slate-400">This is your Hedera testnet account ID.</p>

  <div class="mt-6"
       hx-get="/wallet/balances" hx-trigger="load, every 10s" hx-swap="innerHTML">
    <p class="text-sm text-slate-400">Loading balances…</p>
  </div>
</section>
{% endblock %}

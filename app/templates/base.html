<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VERDET{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg tracking-tight text-emerald-700">VERDET</a>
      {% if user %}
      <div class="flex items-center gap-4 text-sm">
        <nav class="flex gap-3">
          <a href="/wallet" class="text-slate-700 hover:text-emerald-700">Wallet</a>
          <a href="/meters" class="text-slate-700 hover:text-emerald-700">Meters</a>
          <a href="/readings" class="text-slate-700 hover:text-emerald-700">Readings</a>
          <a href="/market" class="text-slate-700 hover:text-emerald-700">Market</a>
        </nav>
        <span class="text-slate-500 hidden sm:inline">{{ user.email }}</span>
        <form method="post" action="/logout">
          <button class="text-slate-600 hover:text-slate-900 underline">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

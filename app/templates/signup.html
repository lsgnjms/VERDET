{% extends "_auth_layout.html" %}
{% block title %}Sign up · VERDET{% endblock %}
{% block form %}
<h1 class="text-2xl font-bold tracking-tight">Create your account</h1>
<p class="mt-1.5 text-sm text-muted">You'll get a Hedera testnet account right away. Its ID is your App ID.</p>

{% if error %}
<div class="mt-5 flex gap-2 rounded-lg border border-down/30 bg-down/10 px-3 py-2.5 text-sm text-down">{{ error }}</div>
{% endif %}

<form method="post" action="/signup" class="mt-6 space-y-4"
      onsubmit="const b = this.querySelector('button'); b.disabled = true; b.innerHTML = '<span class=&quot;h-4 w-4 animate-spin rounded-full border-2 border-ink-950/30 border-t-ink-950&quot;></span>Creating your Hedera account…';">
  <label class="block">
    <span class="label">Email</span>
    <input name="email" type="email" required value="{{ email or '' }}" autocomplete="email" placeholder="you@example.com" class="input mt-1.5">
  </label>
  <label class="block">
    <span class="label">Password <span class="normal-case tracking-normal text-muted/70">(8+ characters)</span></span>
    <input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••" class="input mt-1.5">
  </label>
  <button class="btn-primary w-full py-3">Sign up</button>
</form>
<p class="mt-6 text-center text-sm text-muted">Already have an account? <a href="/login" class="font-medium text-sun-400 hover:underline">Log in</a></p>
{% endblock %}

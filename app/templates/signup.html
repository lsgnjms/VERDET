{% extends "base.html" %}
{% block title %}Sign up · VERDET{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl shadow-sm border border-slate-200 p-6">
  <h1 class="text-xl font-semibold mb-1">Create your account</h1>
  <p class="text-sm text-slate-500 mb-5">You'll get a Hedera testnet account right away. Its ID is your App ID.</p>

  {% if error %}
  <p class="mb-4 rounded-md bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">{{ error }}</p>
  {% endif %}

  <form method="post" action="/signup" class="space-y-4"
        onsubmit="const b = this.querySelector('button'); b.disabled = true; b.textContent = 'Creating your Hedera account…';">
    <label class="block">
      <span class="text-sm font-medium">Email</span>
      <input name="email" type="email" required value="{{ email or '' }}" autocomplete="email"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </label>
    <label class="block">
      <span class="text-sm font-medium">Password <span class="text-slate-400">(8+ characters)</span></span>
      <input name="password" type="password" required minlength="8" autocomplete="new-password"
             class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </label>
    <button class="w-full rounded-md bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 text-white font-medium py-2">
      Sign up
    </button>
  </form>
  <p class="mt-4 text-sm text-center text-slate-500">Already have an account? <a href="/login" class="text-emerald-700 underline">Log in</a></p>
</div>
{% endblock %}

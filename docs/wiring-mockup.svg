<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="1240" fill="#ffffff"/>

  <text x="40" y="45" font-size="26" font-weight="bold" fill="#111">VERDET meter: prototype mock-up</text>
  <text x="40" y="72" font-size="14" fill="#555">Built only from the parts on hand. Uncalibrated: it shows real signed readings, not lab-grade measurements.</text>

  <g font-size="13" fill="#333">
    <line x1="800" y1="30" x2="840" y2="30" stroke="#d62828" stroke-width="4"/><text x="848" y="35">Power + (load current)</text>
    <line x1="800" y1="52" x2="840" y2="52" stroke="#111" stroke-width="4"/><text x="848" y="57">Power − / GND</text>
    <line x1="800" y1="74" x2="840" y2="74" stroke="#1d4ed8" stroke-width="2"/><text x="848" y="79">Signal to the Mega (jumper)</text>
    <line x1="800" y1="96" x2="840" y2="96" stroke="#ea580c" stroke-width="2"/><text x="848" y="101">5 V supply to the sensor (jumper)</text>
  </g>

  <rect x="20" y="115" width="1160" height="650" fill="none" stroke="#cbd5e1" stroke-width="2" rx="10"/>

  <!-- Solar panel -->
  <rect x="60" y="160" width="140" height="150" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <line x1="60" y1="210" x2="200" y2="210" stroke="#0369a1"/><line x1="60" y1="260" x2="200" y2="260" stroke="#0369a1"/>
  <line x1="107" y1="160" x2="107" y2="310" stroke="#0369a1"/><line x1="153" y1="160" x2="153" y2="310" stroke="#0369a1"/>
  <text x="130" y="333" font-size="14" text-anchor="middle" font-weight="bold">20 W solar panel</text>
  <text x="130" y="350" font-size="12" text-anchor="middle" fill="#555">"12 V", open circuit ≈ 22 V</text>
  <text x="208" y="183" font-size="18" font-weight="bold" fill="#d62828">+</text>
  <text x="208" y="305" font-size="18" font-weight="bold">−</text>

  <!-- D2 blocking diode in the panel + line (anode left, cathode bar right) -->
  <line x1="200" y1="190" x2="255" y2="190" stroke="#d62828" stroke-width="4"/>
  <polygon points="255,175 255,205 283,190" fill="#111"/>
  <line x1="284" y1="175" x2="284" y2="205" stroke="#111" stroke-width="3"/>
  <line x1="284" y1="190" x2="480" y2="190" stroke="#d62828" stroke-width="4"/>
  <text x="236" y="166" font-size="11">D2 1N5819 (blocks reverse current)</text>
  <circle cx="360" cy="190" r="5" fill="#111"/>

  <!-- Barrel jack (alternative source) -->
  <rect x="300" y="250" width="120" height="70" fill="#f1f5f9" stroke="#334155" stroke-width="2" rx="6"/>
  <text x="360" y="280" font-size="12" text-anchor="middle" font-weight="bold">DC barrel jack</text>
  <text x="360" y="296" font-size="11" text-anchor="middle" fill="#555">12 V adapter</text>
  <text x="360" y="311" font-size="11" text-anchor="middle" fill="#555">(indoor demo)</text>
  <line x1="360" y1="190" x2="360" y2="250" stroke="#d62828" stroke-width="3"/>
  <text x="368" y="244" font-size="12" font-weight="bold" fill="#d62828">+</text>
  <line x1="360" y1="320" x2="360" y2="700" stroke="#111" stroke-width="3"/>
  <text x="368" y="336" font-size="12" font-weight="bold">−</text>

  <!-- ACS712 -->
  <rect x="480" y="150" width="200" height="140" fill="#fffbeb" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="580" y="214" font-size="16" text-anchor="middle" font-weight="bold">ACS712-20A</text>
  <text x="580" y="232" font-size="11" text-anchor="middle" fill="#555">current sensor</text>
  <g font-size="12"><text x="488" y="194">IP+</text><text x="488" y="254">IP−</text>
    <text x="672" y="174" text-anchor="end">VCC</text><text x="672" y="214" text-anchor="end">GND</text><text x="672" y="254" text-anchor="end">OUT</text></g>

  <!-- Load path: IP- -> top node -> fan -> GND -->
  <polyline points="480,250 440,250 440,330" fill="none" stroke="#d62828" stroke-width="4"/>
  <line x1="440" y1="330" x2="620" y2="330" stroke="#d62828" stroke-width="3"/>
  <circle cx="440" cy="330" r="5" fill="#111"/><circle cx="540" cy="330" r="5" fill="#111"/>
  <line x1="440" y1="330" x2="440" y2="365" stroke="#d62828" stroke-width="4"/>
  <circle cx="440" cy="400" r="35" fill="#fff7ed" stroke="#111" stroke-width="2"/>
  <text x="440" y="408" font-size="20" text-anchor="middle" font-weight="bold">FAN</text>
  <text x="479" y="372" font-size="11">12 V fan</text>
  <line x1="440" y1="435" x2="440" y2="700" stroke="#111" stroke-width="4"/>
  <!-- D1 flyback across the fan (bar/cathode to +) -->
  <line x1="540" y1="330" x2="540" y2="380" stroke="#111" stroke-width="2"/>
  <polygon points="525,410 555,410 540,382" fill="#111"/>
  <line x1="525" y1="381" x2="555" y2="381" stroke="#111" stroke-width="3"/>
  <line x1="540" y1="410" x2="540" y2="520" stroke="#111" stroke-width="2"/>
  <line x1="440" y1="520" x2="540" y2="520" stroke="#111" stroke-width="2"/>
  <circle cx="440" cy="520" r="5" fill="#111"/>
  <text x="548" y="440" font-size="11">D1 1N5819</text><text x="548" y="454" font-size="11">bar to fan +</text>

  <!-- Voltage divider 47k / 10k -->
  <line x1="620" y1="330" x2="620" y2="360" stroke="#d62828" stroke-width="2"/>
  <rect x="608" y="360" width="24" height="70" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="640" y="392" font-size="12" font-weight="bold">R1 47 kΩ</text><text x="640" y="407" font-size="11" fill="#555">(top)</text>
  <line x1="620" y1="430" x2="620" y2="470" stroke="#111" stroke-width="2"/>
  <circle cx="620" cy="450" r="5" fill="#111"/>
  <rect x="608" y="470" width="24" height="70" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="640" y="502" font-size="12" font-weight="bold">R2 10 kΩ</text><text x="640" y="517" font-size="11" fill="#555">(bottom)</text>
  <line x1="620" y1="540" x2="620" y2="700" stroke="#111" stroke-width="2"/>
  <!-- 104 capacitor from A0 node to GND -->
  <line x1="720" y1="450" x2="720" y2="575" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="705" y1="575" x2="735" y2="575" stroke="#111" stroke-width="3"/><line x1="705" y1="585" x2="735" y2="585" stroke="#111" stroke-width="3"/>
  <line x1="720" y1="585" x2="720" y2="700" stroke="#111" stroke-width="2"/>
  <text x="742" y="585" font-size="11">C1 104 (100 nF)</text><text x="742" y="599" font-size="11" fill="#555">optional filter</text>
  <circle cx="720" cy="450" r="5" fill="#111"/>

  <!-- Ground rail -->
  <polyline points="200,300 220,300 220,700 850,700 850,210" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="360" cy="700" r="5" fill="#111"/><circle cx="440" cy="700" r="5" fill="#111"/>
  <circle cx="620" cy="700" r="5" fill="#111"/><circle cx="720" cy="700" r="5" fill="#111"/>
  <circle cx="850" cy="210" r="5" fill="#111"/>
  <text x="460" y="725" font-size="12" fill="#333">Common GND: panel −, jack −, fan −, divider, sensor GND and Mega GND all joined</text>

  <!-- Mega -->
  <rect x="880" y="140" width="250" height="420" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="1005" y="350" font-size="17" text-anchor="middle" font-weight="bold">Arduino Mega 2560</text>
  <text x="1005" y="370" font-size="11" text-anchor="middle" fill="#555">firmware/meter/meter.ino</text>
  <g font-size="12"><text x="888" y="174">5V</text><text x="888" y="214">GND</text><text x="888" y="254">A1 (current)</text><text x="888" y="454">A0 (voltage)</text></g>
  <line x1="1005" y1="560" x2="1005" y2="600" stroke="#555" stroke-width="2"/>
  <text x="1005" y="618" font-size="12" text-anchor="middle" fill="#555">USB → laptop</text>
  <text x="1005" y="634" font-size="12" text-anchor="middle" fill="#555">gateway/serial_bridge.py</text>

  <!-- Sensor jumpers -->
  <line x1="680" y1="170" x2="880" y2="170" stroke="#ea580c" stroke-width="2"/>
  <line x1="680" y1="210" x2="880" y2="210" stroke="#111" stroke-width="2"/>
  <line x1="680" y1="250" x2="880" y2="250" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M620 450 L842 450 A8 8 0 0 1 858 450 L880 450" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="700" y="442" font-size="11" fill="#1d4ed8">divider midpoint → A0</text>

  <!-- Notes -->
  <text x="40" y="815" font-size="18" font-weight="bold" fill="#111">Notes</text>
  <g font-size="13" fill="#222">
    <text x="40" y="843">1. Use ONE source at a time: the panel (outdoors) OR a 12 V adapter in the barrel jack (indoors). Never both.</text>
    <text x="40" y="867">2. ⚠ Fan voltage: a 20 W panel with only a fan on it sits near 18–21 V; 12 V fans are usually rated to ~13.8 V.</text>
    <text x="58" y="887">Prefer the 12 V adapter for the demo; if you film with the panel, connect the fan only briefly.</text>
    <text x="40" y="911">3. Divider order matters: 47 kΩ on TOP (to +), 10 kΩ on the BOTTOM (to GND). 22 V in → about 3.9 V at A0 (safe).</text>
    <text x="58" y="931">Never use 47 k + 47 k or 10 k + 10 k: that halves the voltage, and 11 V at A0 destroys the pin.</text>
    <text x="40" y="955">4. D1 across the fan: bar (cathode) to fan +. D2 in the panel + line: bar (cathode) towards the circuit.</text>
    <text x="40" y="979">5. Thick wire for the red/black load path; jumpers only for the 4 signal/supply wires to the Mega.</text>
    <text x="40" y="1003">6. The ACS712-20A is coarse at fan current (~0.15 A ≈ 3 ADC steps): readings are real but rough. Labelled "uncalibrated".</text>
    <text x="40" y="1027">7. Never connect the panel or adapter directly to any Mega pin; only the divider midpoint goes to A0.</text>
    <text x="40" y="1051">8. Register the meter with rated power 20 W (the panel's rating).</text>
  </g>

  <text x="40" y="1095" font-size="16" font-weight="bold" fill="#111">Parts used</text>
  <text x="40" y="1120" font-size="13" fill="#222">Arduino Mega + USB cable · 20 W solar panel · ACS712-20A · R1 47 kΩ · R2 10 kΩ · 2× 1N5819 · 12 V fan · DC barrel jack · breadboard · jumpers</text>
  <text x="40" y="1142" font-size="13" fill="#222">Optional: 100 nF (104) capacitor · any 12 V DC adapter for indoor filming</text>
  <text x="40" y="1200" font-size="11" fill="#888">VERDET · docs/wiring-mockup.svg · Oct 20 2026</text>
</svg>

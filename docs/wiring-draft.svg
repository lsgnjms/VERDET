<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1640" viewBox="0 0 1200 1640" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="1640" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="45" font-size="26" font-weight="bold" fill="#111">VERDET meter: wiring draft</text>
  <text x="40" y="72" font-size="14" fill="#555">Arduino Mega + solar panel + DC motor. Draft for study; final version after parts arrive (Phase 4).</text>

  <!-- Legend -->
  <g font-size="13" fill="#333">
    <line x1="800" y1="30" x2="840" y2="30" stroke="#d62828" stroke-width="4"/><text x="848" y="35">Power + (load current, thick wire)</text>
    <line x1="800" y1="52" x2="840" y2="52" stroke="#111" stroke-width="4"/><text x="848" y="57">Power − / GND (thick wire)</text>
    <line x1="800" y1="74" x2="840" y2="74" stroke="#1d4ed8" stroke-width="2"/><text x="848" y="79">Signal / data (jumper wire)</text>
    <line x1="800" y1="96" x2="840" y2="96" stroke="#ea580c" stroke-width="2"/><text x="848" y="101">5 V supply to module (jumper wire)</text>
  </g>

  <!-- ===================== OPTION A: INA219 ===================== -->
  <rect x="20" y="115" width="1160" height="560" fill="none" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <text x="40" y="145" font-size="19" font-weight="bold" fill="#047857">Option A (preferred): INA219 module, measures voltage AND current</text>

  <!-- Solar panel A -->
  <g>
    <rect x="60" y="180" width="140" height="160" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <line x1="60" y1="233" x2="200" y2="233" stroke="#0369a1"/><line x1="60" y1="286" x2="200" y2="286" stroke="#0369a1"/>
    <line x1="107" y1="180" x2="107" y2="340" stroke="#0369a1"/><line x1="153" y1="180" x2="153" y2="340" stroke="#0369a1"/>
    <text x="130" y="365" font-size="14" text-anchor="middle" font-weight="bold">Solar panel</text>
    <text x="130" y="383" font-size="12" text-anchor="middle" fill="#555">12 V, 5–10 W</text>
    <text x="210" y="195" font-size="18" font-weight="bold" fill="#d62828">+</text>
    <text x="210" y="335" font-size="18" font-weight="bold">−</text>
  </g>

  <!-- INA219 A -->
  <rect x="480" y="160" width="200" height="220" fill="#f0fdf4" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="580" y="235" font-size="17" text-anchor="middle" font-weight="bold">INA219</text>
  <text x="580" y="255" font-size="11" text-anchor="middle" fill="#555">built-in 0.1 Ω shunt</text>
  <text x="580" y="270" font-size="11" text-anchor="middle" fill="#555">bus voltage up to 26 V</text>
  <g font-size="12" fill="#111">
    <text x="488" y="204">VIN+</text><text x="488" y="274">VIN−</text>
    <text x="672" y="204" text-anchor="end">VCC</text><text x="672" y="254" text-anchor="end">GND</text>
    <text x="672" y="304" text-anchor="end">SDA</text><text x="672" y="354" text-anchor="end">SCL</text>
  </g>

  <!-- Mega A -->
  <rect x="880" y="160" width="250" height="260" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="1005" y="395" font-size="17" text-anchor="middle" font-weight="bold">Arduino Mega 2560</text>
  <g font-size="12" fill="#111">
    <text x="888" y="204">5V</text><text x="888" y="254">GND</text>
    <text x="888" y="304">SDA (pin 20)</text><text x="888" y="354">SCL (pin 21)</text>
  </g>
  <line x1="1005" y1="420" x2="1005" y2="460" stroke="#555" stroke-width="2"/>
  <text x="1005" y="478" font-size="12" text-anchor="middle" fill="#555">USB → PC</text>
  <text x="1005" y="494" font-size="12" text-anchor="middle" fill="#555">gateway/serial_bridge.py</text>

  <!-- Power path A -->
  <line x1="200" y1="200" x2="480" y2="200" stroke="#d62828" stroke-width="4"/>
  <polyline points="480,270 440,270 440,330" fill="none" stroke="#d62828" stroke-width="4"/>
  <!-- switch S1 -->
  <line x1="440" y1="330" x2="440" y2="345" stroke="#d62828" stroke-width="4"/>
  <circle cx="440" cy="347" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="440" y1="347" x2="462" y2="373" stroke="#111" stroke-width="3"/>
  <circle cx="440" cy="377" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="440" y1="381" x2="440" y2="420" stroke="#d62828" stroke-width="4"/>
  <text x="372" y="366" font-size="12">S1 switch</text>
  <!-- top node -->
  <line x1="440" y1="420" x2="620" y2="420" stroke="#d62828" stroke-width="3"/>
  <circle cx="440" cy="420" r="5" fill="#111"/><circle cx="540" cy="420" r="5" fill="#111"/>
  <!-- motor -->
  <line x1="440" y1="420" x2="440" y2="440" stroke="#d62828" stroke-width="4"/>
  <circle cx="440" cy="475" r="35" fill="#fff7ed" stroke="#111" stroke-width="2"/>
  <text x="440" y="483" font-size="22" text-anchor="middle" font-weight="bold">M</text>
  <line x1="440" y1="510" x2="440" y2="600" stroke="#111" stroke-width="4"/>
  <text x="340" y="470" font-size="12">DC motor</text><text x="340" y="486" font-size="12">12 V</text>
  <!-- flyback diode D1 (cathode/bar at top, to +) -->
  <line x1="540" y1="420" x2="540" y2="455" stroke="#111" stroke-width="2"/>
  <polygon points="525,485 555,485 540,457" fill="#111"/>
  <line x1="525" y1="456" x2="555" y2="456" stroke="#111" stroke-width="3"/>
  <line x1="540" y1="485" x2="540" y2="560" stroke="#111" stroke-width="2"/>
  <text x="645" y="452" font-size="11">D1 1N5819 (flyback):</text><text x="645" y="466" font-size="11">bar (cathode) to motor +</text>
  <!-- capacitor C1 -->
  <line x1="620" y1="420" x2="620" y2="520" stroke="#111" stroke-width="2"/>
  <line x1="605" y1="520" x2="635" y2="520" stroke="#111" stroke-width="3"/>
  <line x1="605" y1="530" x2="635" y2="530" stroke="#111" stroke-width="3"/>
  <line x1="620" y1="530" x2="620" y2="560" stroke="#111" stroke-width="2"/>
  <text x="642" y="530" font-size="11">C1 100 nF</text>
  <!-- bottom node -->
  <line x1="440" y1="560" x2="620" y2="560" stroke="#111" stroke-width="2"/>
  <circle cx="440" cy="560" r="5" fill="#111"/><circle cx="540" cy="560" r="5" fill="#111"/>
  <!-- ground rail A -->
  <polyline points="200,320 200,600 860,600 860,250" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="440" cy="600" r="5" fill="#111"/>
  <circle cx="860" cy="250" r="5" fill="#111"/>
  <text x="560" y="622" font-size="12" fill="#333">Common GND: panel −, motor −, INA219 GND and Mega GND all joined</text>

  <!-- Module wiring A -->
  <line x1="680" y1="200" x2="880" y2="200" stroke="#ea580c" stroke-width="2"/>
  <line x1="680" y1="250" x2="880" y2="250" stroke="#111" stroke-width="2"/>
  <line x1="680" y1="300" x2="880" y2="300" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="680" y1="350" x2="880" y2="350" stroke="#1d4ed8" stroke-width="2"/>
  <text x="780" y="193" font-size="11" text-anchor="middle" fill="#555">jumper</text>

  <text x="40" y="655" font-size="13" fill="#333">Current flows: panel + → VIN+ → (shunt inside INA219) → VIN− → S1 → motor → back to panel −.  Only 4 jumpers go to the Mega.</text>

  <!-- ===================== OPTION B: voltage module + ACS712 ===================== -->
  <rect x="20" y="700" width="1160" height="640" fill="none" stroke="#cbd5e1" stroke-width="2" rx="10"/>
  <text x="40" y="730" font-size="19" font-weight="bold" fill="#b45309">Option B (fallback): 0–25 V voltage sensor module + ACS712-5A current module</text>

  <!-- Solar panel B -->
  <g>
    <rect x="60" y="880" width="140" height="160" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <line x1="60" y1="933" x2="200" y2="933" stroke="#0369a1"/><line x1="60" y1="986" x2="200" y2="986" stroke="#0369a1"/>
    <line x1="107" y1="880" x2="107" y2="1040" stroke="#0369a1"/><line x1="153" y1="880" x2="153" y2="1040" stroke="#0369a1"/>
    <text x="130" y="1065" font-size="14" text-anchor="middle" font-weight="bold">Solar panel</text>
    <text x="130" y="1083" font-size="12" text-anchor="middle" fill="#555">12 V, 5–10 W</text>
    <text x="210" y="895" font-size="18" font-weight="bold" fill="#d62828">+</text>
    <text x="210" y="1035" font-size="18" font-weight="bold">−</text>
  </g>

  <!-- ACS712 B -->
  <rect x="480" y="860" width="200" height="140" fill="#fffbeb" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="580" y="925" font-size="16" text-anchor="middle" font-weight="bold">ACS712-5A</text>
  <text x="580" y="943" font-size="11" text-anchor="middle" fill="#555">current sensor (Hall)</text>
  <g font-size="12">
    <text x="488" y="904">IP+</text><text x="488" y="964">IP−</text>
    <text x="672" y="894" text-anchor="end">VCC</text><text x="672" y="934" text-anchor="end">GND</text>
    <text x="672" y="974" text-anchor="end">OUT</text>
  </g>

  <!-- Voltage module B -->
  <rect x="690" y="1110" width="140" height="120" fill="#fffbeb" stroke="#b45309" stroke-width="2" rx="6"/>
  <text x="760" y="1160" font-size="13" text-anchor="middle" font-weight="bold">Voltage</text>
  <text x="760" y="1176" font-size="13" text-anchor="middle" font-weight="bold">sensor 0–25 V</text>
  <text x="760" y="1194" font-size="10" text-anchor="middle" fill="#555">(5:1 divider board)</text>
  <g font-size="11">
    <text x="698" y="1124">VCC (in +)</text><text x="698" y="1225">GND (in −)</text>
    <text x="824" y="1184" text-anchor="end">S</text>
  </g>

  <!-- Mega B -->
  <rect x="880" y="850" width="250" height="400" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" rx="6"/>
  <text x="1005" y="1110" font-size="17" text-anchor="middle" font-weight="bold">Arduino Mega 2560</text>
  <g font-size="12">
    <text x="888" y="894">5V</text><text x="888" y="934">GND</text>
    <text x="888" y="974">A1 (current)</text><text x="888" y="1184">A0 (voltage)</text>
  </g>
  <line x1="1005" y1="1250" x2="1005" y2="1285" stroke="#555" stroke-width="2"/>
  <text x="1005" y="1302" font-size="12" text-anchor="middle" fill="#555">USB → PC (gateway/serial_bridge.py)</text>

  <!-- Power path B -->
  <line x1="200" y1="900" x2="480" y2="900" stroke="#d62828" stroke-width="4"/>
  <polyline points="480,960 440,960 440,1020" fill="none" stroke="#d62828" stroke-width="4"/>
  <line x1="440" y1="1020" x2="440" y2="1035" stroke="#d62828" stroke-width="4"/>
  <circle cx="440" cy="1037" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="440" y1="1037" x2="462" y2="1063" stroke="#111" stroke-width="3"/>
  <circle cx="440" cy="1067" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="440" y1="1071" x2="440" y2="1100" stroke="#d62828" stroke-width="4"/>
  <text x="372" y="1056" font-size="12">S1 switch</text>
  <!-- top node B (also feeds voltage module) -->
  <polyline points="440,1100 710,1100 710,1110" fill="none" stroke="#d62828" stroke-width="3"/>
  <circle cx="440" cy="1100" r="5" fill="#111"/><circle cx="540" cy="1100" r="5" fill="#111"/><circle cx="620" cy="1100" r="5" fill="#111"/>
  <!-- motor B -->
  <line x1="440" y1="1100" x2="440" y2="1120" stroke="#d62828" stroke-width="4"/>
  <circle cx="440" cy="1155" r="35" fill="#fff7ed" stroke="#111" stroke-width="2"/>
  <text x="440" y="1163" font-size="22" text-anchor="middle" font-weight="bold">M</text>
  <line x1="440" y1="1190" x2="440" y2="1270" stroke="#111" stroke-width="4"/>
  <text x="340" y="1150" font-size="12">DC motor</text><text x="340" y="1166" font-size="12">12 V</text>
  <!-- D1 B -->
  <line x1="540" y1="1100" x2="540" y2="1135" stroke="#111" stroke-width="2"/>
  <polygon points="525,1165 555,1165 540,1137" fill="#111"/>
  <line x1="525" y1="1136" x2="555" y2="1136" stroke="#111" stroke-width="3"/>
  <line x1="540" y1="1165" x2="540" y2="1235" stroke="#111" stroke-width="2"/>
  <text x="548" y="1205" font-size="11">D1</text>
  <!-- C1 B -->
  <line x1="620" y1="1100" x2="620" y2="1195" stroke="#111" stroke-width="2"/>
  <line x1="605" y1="1195" x2="635" y2="1195" stroke="#111" stroke-width="3"/>
  <line x1="605" y1="1205" x2="635" y2="1205" stroke="#111" stroke-width="3"/>
  <line x1="620" y1="1205" x2="620" y2="1235" stroke="#111" stroke-width="2"/>
  <text x="628" y="1225" font-size="11">C1</text>
  <line x1="440" y1="1235" x2="620" y2="1235" stroke="#111" stroke-width="2"/>
  <circle cx="440" cy="1235" r="5" fill="#111"/><circle cx="540" cy="1235" r="5" fill="#111"/>
  <!-- ground rail B -->
  <polyline points="200,1020 200,1270 860,1270 860,930" fill="none" stroke="#111" stroke-width="4"/>
  <line x1="710" y1="1230" x2="710" y2="1270" stroke="#111" stroke-width="3"/>
  <circle cx="440" cy="1270" r="5" fill="#111"/><circle cx="710" cy="1270" r="5" fill="#111"/>
  <circle cx="860" cy="930" r="5" fill="#111"/>

  <!-- Module wiring B -->
  <line x1="680" y1="890" x2="880" y2="890" stroke="#ea580c" stroke-width="2"/>
  <line x1="680" y1="930" x2="880" y2="930" stroke="#111" stroke-width="2"/>
  <line x1="680" y1="970" x2="880" y2="970" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="830" y1="1180" x2="880" y2="1180" stroke="#1d4ed8" stroke-width="2"/>

  <text x="40" y="1318" font-size="13" fill="#333">The voltage module's small "−" output pin is the same ground as its input; tie it to GND if your board has one. Its "+" output pin is not used.</text>

  <!-- ===================== NOTES ===================== -->
  <text x="40" y="1380" font-size="18" font-weight="bold" fill="#111">Notes</text>
  <g font-size="13" fill="#222">
    <text x="40" y="1408">1. Indoor / evening testing: replace the solar panel with the 12 V DC adapter (adapter + where panel + is, adapter − where panel − is).</text>
    <text x="40" y="1432">2. Calibration (±5% checkpoint): replace the motor with the 10–20 Ω, 10 W power resistor. It gives a steady current; motors are noisy.</text>
    <text x="40" y="1456">3. Multimeter check: DC volts across panel + and −; DC amps by putting the meter in series instead of S1 (use the 10 A jack).</text>
    <text x="40" y="1480">4. D1 must point the right way: its bar (cathode) goes to motor +. Backwards, it short-circuits the panel when S1 is closed.</text>
    <text x="40" y="1504">5. Thick red/black wire and screw terminals for the load path; thin jumpers only for the 4–5 signal and supply wires to the Mega.</text>
    <text x="40" y="1528">6. All grounds must be joined (panel −, motor −, sensor GND, Mega GND). Without a common ground the readings are meaningless.</text>
    <text x="40" y="1552">7. Motor must be rated 12 V. A 3–6 V hobby motor will burn out on a 12 V panel (open-circuit about 21 V).</text>
    <text x="40" y="1576">8. Never connect the panel directly to any Mega pin. Only the sensor modules touch the panel's voltage.</text>
  </g>
  <text x="40" y="1615" font-size="11" fill="#888">VERDET · docs/wiring-draft.svg · Draft, Oct 16 2026. Final docs/wiring.png is a Phase 4 deliverable.</text>
</svg>
